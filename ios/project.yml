name: VisionAssist
options:
  bundleIdPrefix: com.willasbery
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

packages:
  VisionAssistCore:
    path: ../core/VisionAssistCore

targets:
  VisionAssist:
    type: application
    platform: iOS
    sources:
      - path: VisionAssist
      - path: ../model/weights/train11-yolov8n-seg-640.mlpackage
    dependencies:
      - package: VisionAssistCore
        product: Masking
      - package: VisionAssistCore
        product: YOLODecoding
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willasbery.visionassist
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: Vision Assist uses the camera to find the pavement ahead of you.
